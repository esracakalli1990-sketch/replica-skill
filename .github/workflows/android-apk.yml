name: Build MotoNav APK

on:
  push:
    branches: [ccr-5899a853-9qfkaa]
    paths: ['motonav/**', 'android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test the web app first
        run: node --test motonav/test/*.test.js

      - name: Install Android SDK parts
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Pack the web app
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_IN: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/motonav.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASS"; ALIAS="$KEY_ALIAS_IN"
            echo "Using the signing key stored in repository secrets."
          else
            PASS="$(openssl rand -hex 16)"; ALIAS=motonav
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MotoNav, O=MotoNav, C=TR"
            echo "No signing key in secrets: made a one-off key. Uninstall the old app before installing a newer APK."
          fi
          echo "::add-mask::$PASS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check the APK
        run: |
          APK="$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" > badging.txt
          head -12 badging.txt
          grep -q "package: name='com.motonav.app'" badging.txt
          grep -q "application-label:'MotoNav'" badging.txt
          grep -q "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" badging.txt
          grep -q "application-icon-" badging.txt
          mkdir -p dist
          cp "$APK" "dist/MotoNav-${VERSION_NAME}.apk"
          (cd dist && sha256sum "MotoNav-${VERSION_NAME}.apk" | tee "MotoNav-${VERSION_NAME}.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: MotoNav-apk
          path: dist/*

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete motonav-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create motonav-latest dist/* \
            --target "$GITHUB_SHA" \
            --title "MotoNav ${VERSION_NAME}" \
            --notes "Android APK built from commit ${GITHUB_SHA::7}. Download the .apk, allow installing from this source on the phone, and open it. Check the .sha256 file if you want to verify the download."
